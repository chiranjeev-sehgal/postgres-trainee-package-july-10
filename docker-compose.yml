version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: debugging_olympics
      POSTGRES_USER: postgres_debugger
      POSTGRES_PASSWORD: postgres_debugger_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_debugger -d debugging_olympics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_debugging_olympics_data:/var/lib/postgresql/data

volumes:
  postgres_debugging_olympics_data:
